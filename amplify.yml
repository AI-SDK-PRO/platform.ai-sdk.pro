version: 1
applications:
  - appRoot: apps/web
    frontend:
      # Install and build from the repository root so npm workspaces and shared packages resolve.
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        # Next.js SSR build output for apps/web.
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
          - apps/web/.next/cache/**/*
