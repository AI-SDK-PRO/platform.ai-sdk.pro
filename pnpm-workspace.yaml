packages:
  - "apps/web"
  - "apps/docs"
  - "packages/ui"
  - "packages/sdk"
  - "packages/create-webapp"

# Keep npm-compatible "*" workspace ranges linked locally under pnpm 10.
# Both apps consume @aisdkpro/ui; apps/web also consumes @aisdkpro/client.
linkWorkspacePackages: true

onlyBuiltDependencies:
  - "@firebase/util"
  - "esbuild"
  - "protobufjs"

# Match the Managed Better Auth server and its SDK-pinned fetch peer.
overrides:
  better-auth: 1.7.12
  "@better-auth/core": 1.7.12
  "@better-auth/oauth-provider": 1.7.12
  better-call: 1.4.4
