name: Build platform image for DigitalOcean Container Registry

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "apps/web/**"
      - "packages/**"
      - "infra/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-docr.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to DigitalOcean Container Registry (requires DIGITALOCEAN_ACCESS_TOKEN)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: build-docr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build Docker image (publish only when selected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: doctl
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
          tags: |
            registry.digitalocean.com/aisdkpro/platform-ai-sdk-pro:${{ github.sha }}
            registry.digitalocean.com/aisdkpro/platform-ai-sdk-pro:latest
