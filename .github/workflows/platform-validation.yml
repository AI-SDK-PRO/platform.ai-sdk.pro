name: Platform validation (no deployment)

on:
  push:
    branches:
      - main
      - feat/platform-phases-0-6-20261117
      - feat/unified-deploy-workspace-20261117
      - feat/platform-native-account-registration-20261117
      - feat/flags-sdk-vercel-blob-20261117
      - feat/free-three-project-public-deploy-20261117
      - fix/github-actions-bun-ci-20261118

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Strict typecheck, security tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript strict checks
        run: bun run typecheck
      - name: Vitest regressions and security boundaries
        run: bun run test
      - name: Install isolated Cloudflare platform test dependencies
        run: npm install --prefix infra/cloudflare-platform --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Cloudflare platform Node test suite
        run: npm --prefix infra/cloudflare-platform test
      - name: Monorepo build
        run: bun run build
      - name: Install isolated Agent Worker dry-run dependencies
        run: npm install --prefix apps/agent-worker --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Cloudflare Keyless Worker dry-run bundle (no deployment)
        working-directory: apps/agent-worker
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir /tmp/aisdkpro-agent-preview
