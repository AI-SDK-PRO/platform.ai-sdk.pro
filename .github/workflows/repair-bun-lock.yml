name: Repair Bun lockfile for Cloudflare

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-bun-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate lockfile from all workspace manifests
        run: bun install --lockfile-only
      - name: Verify frozen lockfile matches manifests
        run: bun install --frozen-lockfile --lockfile-only
      - name: Commit repaired lockfile to main
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(build): synchronize bun.lock with workspaces"
          git push origin HEAD:main
